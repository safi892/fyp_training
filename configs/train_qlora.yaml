model:
  model_name_or_path: Qwen/Qwen2.5-Coder-1.5B-Instruct
  trust_remote_code: true
  torch_dtype: auto
  attn_implementation: sdpa
  flash_attention: false
  use_cache: false

data:
  data_files:
    - cleaned/merged_cleaned.jsonl
  validation_split_ratio: 0.05
  test_split_ratio: 0.0
  max_seq_length: 2048
  preprocessing_num_proc: 2
  cache_dir: .cache/hf-datasets
  train_on_inputs: true
  prompt_style: chat
  output_fields:
    - comments
    - explanation
    - improved_code
    - complexity_analysis

training:
  output_dir: outputs/qwen2.5-coder-1.5b-cpp-review-qlora
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optim: paged_adamw_8bit
  max_grad_norm: 0.3
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  eval_strategy: steps
  save_strategy: steps
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  gradient_checkpointing: true
  bf16: auto
  fp16: auto
  packing: true
  report_to:
    - tensorboard
  seed: 42
  resume_from_checkpoint:
  early_stopping_patience: 5

lora:
  r: 64
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

generation:
  max_new_tokens: 1024
  temperature: 0.2
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.05
