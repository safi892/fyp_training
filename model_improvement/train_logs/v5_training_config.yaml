model:
  model_name_or_path: Qwen/Qwen2.5-Coder-1.5B-Instruct
  trust_remote_code: true
  torch_dtype: auto
  attn_implementation: sdpa
  flash_attention: false
  use_cache: false
data:
  data_files:
  - /kaggle/input/datasets/saffiullah892/loop-02/task_mixture_auto_optimization.jsonl
  dataset_name: null
  dataset_config_name: null
  train_split: train
  validation_split: validation
  test_split: test
  validation_split_ratio: 0.01
  test_split_ratio: 0.0
  max_seq_length: 1024
  preprocessing_num_proc: 2
  cache_dir: /kaggle/temp/hf-datasets
  train_on_inputs: false
  prompt_style: chat
  identifier_augmentation: false
  identifier_augmentation_copies: 1
  output_fields:
  - line_comments
  - explanation
  - improved_code
  - complexity_analysis
training:
  output_dir: /kaggle/working/outputs/qwen2.5-coder-1.5b-cpp-review-auto-optimization-qlora
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optim: adamw_torch
  max_grad_norm: 0.3
  logging_steps: 10
  eval_steps: 250
  save_steps: 250
  save_total_limit: 3
  eval_strategy: steps
  save_strategy: steps
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  gradient_checkpointing: true
  bf16: auto
  fp16: auto
  packing: false
  gradient_checkpointing_use_reentrant: false
  ddp_find_unused_parameters: false
  report_to:
  - tensorboard
  seed: 42
  early_stopping_patience: 5
  disable_tqdm: true
  group_by_length: true
  resume_mode: auto
  resume_from_checkpoint: null
  initial_adapter_path: null
  resume_auto_fallback: true
  overwrite_output_dir: false
lora:
  r: 64
  alpha: 16
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  bias: none
  task_type: CAUSAL_LM
generation:
  max_new_tokens: 1024
  temperature: 0.2
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.05
